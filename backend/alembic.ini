# Alembic configuration for Jericho backend.
# DATABASE_URL env var must be set to the direct PostgreSQL connection string,
# e.g.: postgresql+asyncpg://user:pass@db.supabase.co:5432/postgres

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Populated at runtime from DATABASE_URL env var (see env.py)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
